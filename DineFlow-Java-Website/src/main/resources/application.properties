spring.application.name=DineFlow
server.port=8080
spring.datasource.url=jdbc:h2:file:./data/dineflow;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jackson.serialization.write-dates-as-timestamps=false

# Authentication credentials and JWT settings
dineflow.auth.admin-password=admin123
dineflow.auth.staff-pin=1234
dineflow.jwt.secret=DineFlowSecureJwtSecretKeyForAuthentication2026!#RestPersistToken
dineflow.jwt.expiration-ms=86400000
