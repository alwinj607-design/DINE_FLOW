
spring.application.name=DineFlow
server.port=${PORT:8080}

# Aiven MySQL Database
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=REQUIRED
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# JSON Configuration
spring.jackson.serialization.write-dates-as-timestamps=false

# Authentication credentials and JWT settings
dineflow.auth.admin-password=${DINEFLOW_AUTH_ADMIN_PASSWORD}
dineflow.auth.staff-pin=${DINEFLOW_AUTH_STAFF_PIN}
dineflow.jwt.secret=${DINEFLOW_JWT_SECRET}
dineflow.jwt.expiration-ms=${DINEFLOW_JWT_EXPIRATION_MS:86400000}
